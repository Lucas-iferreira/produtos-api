spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/products
    username: postgres
    password: 123456
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    open-in-view: false
  jwt:
    secret: ${JWT_SECRET}